[package]
name = "lanclip"
version = "0.2.0"
edition = "2021"
description = "Copy to LAN / Paste from LAN from your file manager's context menu"
license = "MIT"

[dependencies]
tiny_http = "0.12"
ureq = { version = "2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
socket2 = "0.5"
if-addrs = "0.13"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
arboard = "3.4"
png = "0.17"
dirs = "5"
open = "5"
getrandom = "0.2"
gethostname = "0.5"
percent-encoding = "2"

[target.'cfg(not(target_os = "macos"))'.dependencies]
notify-rust = "4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
